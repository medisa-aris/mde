[package]
name = "mde"
version = "0.1.0"
edition = "2024"

[dependencies]
eframe = { version = "0.37", features = ["persistence"] }
egui = { version = "0.37", features = ["monochrome_emoji_fonts"] }
egui_commonmark = { version = "0.26", features = ["better_syntax_highlighting", "svg"] }
egui_extras = { version = "0.37", features = ["image", "svg"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp"] }
merman = { version = "0.11", features = ["native-fonts", "png"] }
pulldown-cmark = "0.13"
rfd = "0.18"
serde_json = "1.0.154"
syntect = "5.3"
unicode-segmentation = "1"
winit = "0.30"

[profile.release]
lto = "thin"
strip = true
